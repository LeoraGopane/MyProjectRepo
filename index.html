<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Search App</title>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height:100vh;
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container {
      background:white;
      border-radius:20px;
      box-shadow:0 20px 60px rgba(0,0,0,0.3);
      padding:40px;
      width:100%;
      max-width:500px;
    }

    .header { text-align:center; margin-bottom:30px; }
    .header h1 { color:#333; font-size:32px; margin-bottom:10px; }

    .search-box { position:relative; margin-bottom:30px; }
    .search-box input {
      width:100%;
      padding:15px 50px 15px 20px;
      font-size:16px;
      border:2px solid #e0e0e0;
      border-radius:10px;
      outline:none;
    }

    .search-box button {
      position:absolute;
      right:5px; top:50%;
      transform:translateY(-50%);
      background:#667eea; color:white;
      border:none; padding:10px 20px;
      border-radius:8px; cursor:pointer;
    }

    .loading { text-align:center; display:none; }
    .loading.show { display:block; }

    .error {
      background:#fee; border:1px solid #fcc; color:#c33;
      padding:15px; border-radius:10px; display:none;
    }
    .error.show { display:block; }

    .weather-result {
      background:#e0f7fa;
      border-radius:15px;
      padding:30px;
      text-align:center;
      display:none;
    }
    .weather-result.show { display:block; }

    .temperature { font-size:60px; color:#667eea; }
    .weather-description { text-transform:capitalize; margin:10px 0; }

    .weather-icon img { width:80px; }

    .wind { margin-top:10px; color:#555; }

    .note {
      text-align:center; color:#999; font-size:14px; margin-top:20px;
    }
    .note a { color:#667eea; }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      <h1>🌤️ Weather Search</h1>
      <p>Find current weather for any city</p>
    </div>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name">
      <button id="searchBtn">Search</button>
    </div>

    <div class="error" id="errorMsg"></div>

    <div class="loading" id="loading">Loading...</div>

    <div class="weather-result" id="weatherResult">
      <h2 id="cityName"></h2>

      <div class="weather-icon">
        <img id="weatherIcon" alt="Weather icon">
      </div>

      <div class="temperature" id="temperature"></div>
      <div class="weather-description" id="weatherDesc"></div>
      <div class="wind" id="windSpeed"></div>
    </div>

    <div class="note">
      Coded by Leora 💕 |
      <a href="https://github.com/LeoraGopane/MyProjectRepo" target="_blank">
        GitHub Repository
      </a>
    </div>

  </div>

  <script>
    const API_KEY = "3944cad3c55c2b0fd72a8e8333a59ef8";
    const API_URL = "https://api.openweathermap.org/data/2.5/weather";

    const cityInput = document.getElementById("cityInput");
    const searchBtn = document.getElementById("searchBtn");
    const loading = document.getElementById("loading");
    const errorMsg = document.getElementById("errorMsg");
    const weatherResult = document.getElementById("weatherResult");

    const cityName = document.getElementById("cityName");
    const temperature = document.getElementById("temperature");
    const weatherDesc = document.getElementById("weatherDesc");
    const windSpeed = document.getElementById("windSpeed");
    const weatherIcon = document.getElementById("weatherIcon");

    searchBtn.addEventListener("click", searchWeather);

    async function searchWeather() {
      const city = cityInput.value.trim();
      if (!city) return;

      loading.classList.add("show");
      weatherResult.classList.remove("show");
      errorMsg.classList.remove("show");

      try {
        const res = await fetch(`${API_URL}?q=${city}&units=metric&appid=${API_KEY}`);
        if (!res.ok) throw new Error("City not found");

        const data = await res.json();

        cityName.textContent = `${data.name}, ${data.sys.country}`;
        temperature.textContent = `${Math.round(data.main.temp)}°C`;
        weatherDesc.textContent = data.weather[0].description;
        windSpeed.textContent = `💨 Wind: ${data.wind.speed} m/s`;
        weatherIcon.src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;

        weatherResult.classList.add("show");
      } catch {
        errorMsg.textContent = "City not found";
        errorMsg.classList.add("show");
      } finally {
        loading.classList.remove("show");
      }
    }
  </script>

</body>
</html>
