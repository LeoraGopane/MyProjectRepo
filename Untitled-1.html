<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Search App</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height:100vh;
            background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }
        .container {
            background:white;
            border-radius:20px;
            box-shadow:0 20px 60px rgba(0,0,0,0.3);
            padding:40px;
            width:100%;
            max-width:500px;
            text-align:center;
        }
        .search-box { position:relative; margin-bottom:30px; }
        .search-box input {
            width:100%;
            padding:15px 50px 15px 20px;
            font-size:16px;
            border:2px solid #e0e0e0;
            border-radius:10px;
        }
        .search-box button {
            position:absolute;
            right:5px;
            top:50%;
            transform:translateY(-50%);
            background:#667eea;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:8px;
            cursor:pointer;
        }
        .loading { display:none; padding:30px; }
        .loading.show { display:block; }
        .spinner {
            border:4px solid #f3f3f3;
            border-top:4px solid #667eea;
            border-radius:50%;
            width:40px;
            height:40px;
            margin:0 auto 15px;
            animation:spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform:rotate(0deg);} 100% { transform:rotate(360deg); } }
        .error { display:none; background:#fee; color:#c33; padding:15px; border-radius:10px; margin-bottom:20px; }
        .error.show { display:block; }
        .weather-result { display:none; background:#e0f7fa; border-radius:15px; padding:30px; }
        .weather-result.show { display:block; }
        .city-name { font-size:26px; font-weight:bold; margin-bottom:10px; }
        #weatherIcon { width:100px; height:100px; }
        .temperature { font-size:50px; font-weight:bold; color:#667eea; margin:15px 0; }
        .weather-description { font-size:18px; text-transform:capitalize; }
        #windSpeed { margin-top:10px; font-size:16px; }
        .reset-btn { margin-top:20px; padding:12px 25px; background:#667eea; color:white; border:none; border-radius:8px; cursor:pointer; }
        .note { margin-top:20px; font-size:14px; }
        .note a { color:#667eea; text-decoration:none; font-weight:bold; }
    </style>
</head>
<body>
<div class="container">

    <h1>🌤️ Weather Search</h1>
    <p>Find current weather for any city</p>

    <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button id="searchBtn">Search</button>
    </div>

    <div class="error" id="errorMsg"></div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <div class="weather-result" id="weatherResult">
        <div class="city-name" id="cityName"></div>
        <img id="weatherIcon" alt="Weather icon">
        <div class="temperature" id="temperature"></div>
        <div class="weather-description" id="weatherDesc"></div>
        <p id="windSpeed"></p>
        <button class="reset-btn" id="resetBtn">Search Another City</button>
    </div>

    <div class="note">
        <p>
            Coded by Leora 💕 | 
            <a href="https://github.com/LeoraGopane/js.searchengine" target="_blank">GitHub Repository</a>
        </p>
    </div>

</div>

<script>
    const API_KEY = "3944cad3c55c2b0fd72a8e8333a59ef8";
    const API_URL = "https://api.openweathermap.org/data/2.5/weather";

    const cityInput = document.getElementById("cityInput");
    const searchBtn = document.getElementById("searchBtn");
    const loading = document.getElementById("loading");
    const errorMsg = document.getElementById("errorMsg");
    const weatherResult = document.getElementById("weatherResult");
    const cityName = document.getElementById("cityName");
    const temperature = document.getElementById("temperature");
    const weatherDesc = document.getElementById("weatherDesc");
    const weatherIcon = document.getElementById("weatherIcon");
    const windSpeed = document.getElementById("windSpeed");
    const resetBtn = document.getElementById("resetBtn");

    async function searchWeather() {
        const city = cityInput.value.trim();
        if (!city) { showError("Please enter a city name"); return; }

        hideAll();
        loading.classList.add("show");

        try {
            const response = await fetch(`${API_URL}?q=${city}&units=metric&appid=${API_KEY}`);
            if (!response.ok) { showError("City not found"); return; }
            const data = await response.json();
            displayWeather(data);
        } catch {
            showError("Failed to fetch weather data");
        } finally {
            loading.classList.remove("show");
        }
    }

    function displayWeather(data) {
        cityName.textContent = `${data.name}, ${data.sys.country}`;
        temperature.textContent = `${Math.round(data.main.temp)}°C`;
        weatherDesc.textContent = data.weather[0].description;
        windSpeed.textContent = `Wind Speed: ${data.wind.speed} m/s`;
        weatherIcon.src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
        weatherResult.classList.add("show");
    }

    function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.add("show"); }
    function hideAll() { errorMsg.classList.remove("show"); weatherResult.classList.remove("show"); }
    function reset() { cityInput.value = ""; hideAll(); }

    searchBtn.addEventListener("click", searchWeather);
    resetBtn.addEventListener("click", reset);
    cityInput.addEventListener("keypress", e => { if (e.key === "Enter") searchWeather(); });
</script>

</body>
</html>
